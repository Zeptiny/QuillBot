name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: lint + tests (Python 3.11)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The minor version the image actually ships. Local development runs a
          # newer one, so this is the only place the two are forced to agree.
          python-version: "3.11"
          cache: pip

      # Also the check that the documented install still resolves: the pins in
      # requirements.txt are open-ended, so this job can go red on an upstream
      # release with no code change on our side.
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      # The voice tests encode and decode real opus frames (they skip without it).
      - name: Install libopus
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libopus0

      - name: Lint
        run: ruff check .

      - name: Test
        run: python -m pytest -q
